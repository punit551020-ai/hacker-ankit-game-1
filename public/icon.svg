<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0017"/>
      <stop offset="50%" stop-color="#150530"/>
      <stop offset="100%" stop-color="#050011"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077fe"/>
    </linearGradient>
    <linearGradient id="pinkNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff00ea"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer Neon Border Ring -->
  <rect x="20" y="20" width="472" height="472" rx="84" fill="none" stroke="url(#cyanNeon)" stroke-width="6" opacity="0.8" filter="url(#glow)"/>
  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="url(#pinkNeon)" stroke-width="2" opacity="0.5"/>

  <!-- Cyber Grid Lines -->
  <path d="M60 380 L452 380 M100 420 L412 420 M140 450 L372 450" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>
  <path d="M256 350 L256 470 M180 370 L140 470 M332 370 L372 470" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>

  <!-- Sun Horizon Glow -->
  <circle cx="256" cy="220" r="130" fill="url(#pinkNeon)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="115" fill="url(#gold)"/>

  <!-- Cyber Runner Helmet Silhouette -->
  <!-- Helmet Dome -->
  <path d="M190 230 C190 145 322 145 322 230 L328 290 L290 325 L222 325 L184 290 Z" fill="#0d0421" stroke="url(#cyanNeon)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Aerodynamic Crest -->
  <polygon points="256,120 270,180 242,180" fill="url(#pinkNeon)"/>
  
  <!-- Glowing Cyber Visor -->
  <path d="M200 230 Q256 215 312 230 L318 262 Q256 276 194 262 Z" fill="#00ffff" filter="url(#glow)"/>
  <path d="M204 235 Q256 222 308 235 L312 248 Q256 256 200 248 Z" fill="#ffffff"/>

  <!-- Chest Power Core / Arc Logo -->
  <polygon points="256,335 278,368 234,368" fill="url(#cyanNeon)" filter="url(#glow)"/>
  <polygon points="256,342 270,364 242,364" fill="#ffffff"/>

  <!-- Brand Typography -->
  <text x="256" y="80" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="34" fill="#00ffff" letter-spacing="4" filter="url(#glow)">HACKER ANKIT</text>
  <text x="256" y="445" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="800" font-size="28" fill="#ff00aa" letter-spacing="8" filter="url(#glow)">GAME</text>
</svg>
